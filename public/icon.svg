  <rect y="15" width="16" height="1" fill="#233D56"/>
  <rect x="6" y="12" width="4" height="1" fill="#F6B65E"/>
  <rect x="7" y="13" width="2" height="1" fill="#FFD16B"/>
  <rect x="5" y="14" width="6" height="1" fill="#EA9860"/>
  <rect x="6" y="15" width="4" height="1" fill="#D77C5D"/>
